<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 333" role="img"><title>将重排放回类群背景</title><rect width="520" height="333" fill="#fffefa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#193f35"><text x="26" y="30" font-size="11" letter-spacing="2">CASE STUDY · DIPRIONIDAE</text><text x="26" y="64" font-size="23" font-weight="600">将重排放回类群背景</text><g><rect x="26" y="100" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="123" font-size="16" font-weight="600">松叶蜂科取样</text><text x="45" y="143" font-size="12" fill="#53675e">在类群内比较线粒体基因组</text><path d="M260 158v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="171" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="194" font-size="16" font-weight="600">并行核对三类证据</text><text x="45" y="214" font-size="12" fill="#53675e">基因顺序 · 序列 · 形态</text><path d="M260 229v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="242" width="468" height="57" rx="6" fill="#e6ecf4"/><text x="45" y="265" font-size="16" font-weight="600">关注 nad2 邻近区域</text><text x="45" y="285" font-size="12" fill="#53675e">描述重排模式并评估系统学信息</text></g><text x="26" y="321" font-size="10" fill="#6c7770">据预印本研究简介绘制 · 非原始基因顺序图</text></g></svg>