<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" role="img"><title>让基因组织差异可量化</title><rect width="520" height="404" fill="#fffefa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#193f35"><text x="26" y="30" font-size="11" letter-spacing="2">METHOD · qGO</text><text x="26" y="64" font-size="23" font-weight="600">让基因组织差异可量化</text><g><rect x="26" y="100" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="123" font-size="16" font-weight="600">输入与人工同源比对</text><text x="45" y="143" font-size="12" fill="#53675e">输入基因顺序；逐一确定对应关系</text><path d="M260 158v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="171" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="194" font-size="16" font-weight="600">设定比较分区</text><text x="45" y="214" font-size="12" fill="#53675e">依据控制区与复制起点设定分区</text><path d="M260 229v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="242" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="265" font-size="16" font-weight="600">逐基因、逐配对评分</text><text x="45" y="285" font-size="12" fill="#53675e">结合方向、区域与相对位置的差异</text><path d="M260 300v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="313" width="468" height="57" rx="6" fill="#e6ecf4"/><text x="45" y="336" font-size="16" font-weight="600">汇总与比较</text><text x="45" y="356" font-size="12" fill="#53675e">输出重排评分矩阵及基因重排频率</text></g><text x="26" y="392" font-size="10" fill="#6c7770">据 Shi et al. 2024 Figure 1 重排 · 非原始结果图</text></g></svg>