<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 333" role="img"><title>从共同骨架到局部差异</title><rect width="520" height="333" fill="#fffefa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#193f35"><text x="26" y="30" font-size="11" letter-spacing="2">COMPARATIVE STRUCTURE · 12S rRNA</text><text x="26" y="64" font-size="23" font-weight="600">从共同骨架到局部差异</text><g><rect x="26" y="100" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="123" font-size="16" font-weight="600">序列与结构比较</text><text x="45" y="143" font-size="12" fill="#53675e">脊椎动物线粒体 12S rRNA</text><path d="M260 158v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="171" width="468" height="57" rx="6" fill="#edf2e9"/><text x="45" y="194" font-size="16" font-weight="600">识别共同骨架</text><text x="45" y="214" font-size="12" fill="#53675e">建立同源结构的比较坐标</text><path d="M260 229v9m-4-4 4 4 4-4" stroke="#708879" fill="none"/></g><g><rect x="26" y="242" width="468" height="57" rx="6" fill="#e6ecf4"/><text x="45" y="265" font-size="16" font-weight="600">整理可变模块</text><text x="45" y="285" font-size="12" fill="#53675e">比较局部结构类型与注释边界</text></g><text x="26" y="321" font-size="10" fill="#6c7770">据研究简介绘制的概念示意 · 非实测结构图</text></g></svg>